<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3E12E3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1114" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kona" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" />
    <title>Kona</title>
  </head>
  <body>
    <section id="login" class="login" hidden>
      <div class="eyebrow">Kona 2029</div>
      <h1>Anmelden</h1>
      <form id="login-form" class="card">
        <label class="fld"><span class="lbl">E-Mail</span><input class="inp" id="login-mail" type="email" autocomplete="email" required /></label>
        <label class="fld"><span class="lbl">Passwort</span><input class="inp" id="login-pw" type="password" autocomplete="current-password" minlength="8" required /></label>
        <button class="act pri" id="login-go" type="submit">Anmelden</button>
        <button class="act quiet" id="login-neu" type="button">Ich habe noch kein Konto</button>
        <div class="hint" id="login-msg" role="status"></div>
      </form>
    </section>
    <section id="setup-fehlt" class="login" hidden>
      <h1>Noch nicht eingerichtet</h1>
      <p class="card">Die Verbindung zur Datenbank fehlt. Trag VITE_SUPABASE_URL und VITE_SUPABASE_PUBLISHABLE_KEY bei Vercel ein und veröffentliche neu.</p>
    </section>
    <div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">Kona · Base-Block</div>
    <h1 id="title">Heute</h1>
    <div class="sub" id="sub"></div>
    <div id="kbar" hidden>
      <div class="bar" id="bar"><i></i></div>
      <div class="prog"><span id="progtxt"></span><span></span></div>
    </div>
  </header>
  <div id="setup" class="list" hidden></div>
  <div class="strip" id="strip" aria-label="Wochentage"></div>
  <main id="main" class="list"></main>
  <p class="foot"><span id="foot"></span> <span id="sync"></span></p>
</div>
<nav role="tablist" aria-label="Ansicht">
  <button class="tab" role="tab" data-v="today" id="t-today" type="button"><b>●</b><span>Tag</span></button>
  <button class="tab" role="tab" data-v="kraft" id="t-kraft" type="button"><b>A·B·C</b><span>Kraft</span></button>
  <button class="tab" role="tab" data-v="kurs" id="t-kurs" type="button"><b>→</b><span>Kurs</span></button>
  <button class="tab" role="tab" data-v="saison" id="t-saison" type="button"><b>◇</b><span>Saison</span></button>
</nav>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
